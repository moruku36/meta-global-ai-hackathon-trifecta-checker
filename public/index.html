<style>
 body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:#0f172a;color:#e2e8f0}
 main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
 h1{font-size:24px;margin:0}
 .lead{color:#cbd5e1;font-size:14px;line-height:1.55}
 .lead b{color:#fff}
 .card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;margin:16px 0}
 button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:12px 16px;font-size:16px;cursor:pointer;min-height:48px}
 fieldset{border:1px solid #334155;border-radius:8px;margin:0 0 14px;padding:6px 12px 10px}
 legend{padding:0 6px;color:#93c5fd;font-size:15px;font-weight:600}
 label{display:flex;align-items:center;gap:10px;padding:9px 4px;cursor:pointer;font-size:16px;border-radius:6px}
 label:active{background:#273549}
 input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:#2563eb}
 select,input[type=text]{background:#0b1220;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:10px;font-size:16px}
 input[type=text]{width:100%;box-sizing:border-box}
 .badge{font-weight:700;padding:3px 12px;border-radius:999px;color:#0b1220}
 .Low{background:#4ade80}.Risky{background:#facc15}.Lethal{background:#f87171}
 .elem{display:inline-block;margin:4px 6px 0 0;padding:4px 10px;border-radius:999px;font-size:13px}
 .elem.on{background:#7f1d1d;color:#fecaca}.elem.off{background:#164e2a;color:#bbf7d0}
 pre{white-space:pre-wrap;font-size:14px;line-height:1.6;margin:8px 0 0;font-family:inherit}
 .muted{color:#94a3b8;font-size:13px}
 details.card summary{cursor:pointer;font-size:17px;font-weight:600;padding:2px 0}
 .row{display:flex;gap:10px;align-items:flex-end;margin-top:10px}
 .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
 .brand{display:flex;align-items:center;gap:12px}
 .mascot{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#f5f0e6}
 .avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#f5f0e6;flex:none;margin-top:2px}
 #chat{display:flex;flex-direction:column;gap:12px;margin:18px 0}
 .msg{display:flex;gap:8px;max-width:100%}
 .msg.user{justify-content:flex-end}
 .bubble{border-radius:14px;padding:10px 14px;font-size:15px;line-height:1.55;max-width:85%}
 .msg.user .bubble{background:#2563eb;color:#fff;border-bottom-right-radius:4px}
 .msg.bot .bubble{background:#1e293b;border:1px solid #334155;border-bottom-left-radius:4px}
 .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
 .chip{background:#0b1220;border:1px solid #2563eb;color:#93c5fd;border-radius:999px;padding:8px 14px;font-size:14px;min-height:40px;cursor:pointer}
 .chip:disabled{opacity:.45;cursor:default}
 .dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:#93c5fd;margin-right:4px;animation:blink 1.2s infinite}
 .dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
 @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
 .inputbar{position:sticky;bottom:0;background:#0f172a;padding:10px 0 4px}
 .composer{display:flex;gap:8px;align-items:flex-end;background:#1e293b;border:1px solid #334155;border-radius:20px;padding:8px}
 textarea{flex:1;min-height:40px;max-height:180px;background:transparent;color:#e2e8f0;border:0;outline:none;padding:10px 4px;font-size:16px;box-sizing:border-box;resize:none;overflow-y:auto;scrollbar-width:none}
 textarea::-webkit-scrollbar{display:none}
 .iconbtn{border-radius:50%;width:44px;height:44px;flex:none;font-size:19px;padding:0;min-height:44px;background:#2563eb}
 .iconbtn.ghost{background:transparent;border:0;color:#cbd5e1}
 #recbar{display:none;gap:10px;align-items:center;background:#1e293b;border:1px solid #334155;border-radius:20px;padding:8px}
 #recbar.on{display:flex}
 #rectime{color:#94a3b8;font-size:14px;min-width:34px;text-align:center}
 #wave{flex:1;display:flex;gap:2px;align-items:center;height:26px;overflow:hidden}
 #wave span{flex:1;min-width:2px;height:5px;background:#60a5fa;border-radius:2px}
 #wave.cssanim span{animation:wv .9s ease-in-out infinite}
 #wave.cssanim span:nth-child(2n){animation-delay:.15s}#wave.cssanim span:nth-child(3n){animation-delay:.3s}#wave.cssanim span:nth-child(4n){animation-delay:.45s}
 @keyframes wv{0%,100%{height:5px}50%{height:20px}}
 @media (min-width:720px){
   main{max-width:920px}
   .qgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:start}
 }
</style></head><body><main>

const DATA = {"strings": {"lead": {"en": "Let's check whether your AI agent is safe to use. Just tell me what it does, in your own words — I'll look at whether a risky mix of powers is hiding in it: reading your <b>private data</b>, taking in <b>content from other people</b>, and <b>sending things out</b>. One of those alone is fine; trouble starts when they all meet in one agent.", "ja": "あなたのAIエージェントが、安全に使えるかどうかを一緒に確かめます。ふだんの言葉で「何をするものか」を教えてくれればOK。危ないのは、<b>大事なデータを読む</b>・<b>よそから来た文を読む</b>・<b>外に送れる</b>、この3つが1つのエージェントに揃ったとき。その組み合わせになっていないか見ていくよ。", "zh": "我们一起看看你的 AI 智能体用起来安不安全。你只要用平时的话说说它是做什么的就行。真正危险的是三种能力凑在同一个智能体上：<b>读到重要数据</b>、<b>读别人发来的内容</b>、<b>能往外发东西</b>。我来帮你检查有没有这种情况。", "hi": "आइए साथ में जाँचें कि आपका AI एजेंट इस्तेमाल के लिए सुरक्षित है या नहीं। बस अपनी भाषा में बताएँ कि यह क्या करता है। खतरा तब होता है जब तीन शक्तियाँ एक ही एजेंट में मिल जाएँ: <b>ज़रूरी डेटा पढ़ना</b>, <b>दूसरों की सामग्री पढ़ना</b>, और <b>बाहर कुछ भेज पाना</b>। मैं देखकर बताऊँगा कि ऐसा मेल तो नहीं है।", "es": "Vamos a comprobar juntos si tu agente de IA es seguro de usar. Solo cuéntame con tus palabras qué hace. El peligro aparece cuando tres poderes se juntan en un mismo agente: <b>leer datos importantes</b>, <b>leer contenido de otras personas</b> y <b>poder enviar cosas fuera</b>. Reviso si esa mezcla está presente."}, "verdict_say": {"en": "I had a look — the verdict is {v}.", "ja": "見てみたよ。判定は {v} だね。", "zh": "我看过了，判定是 {v}。", "hi": "मैंने देख लिया — निर्णय है {v}।", "es": "Ya lo revisé: el veredicto es {v}."}, "lang_label": {"en": "Language", "ja": "言語", "zh": "语言", "hi": "भाषा", "es": "Idioma"}, "greeting": {"en": "Hi, I'm Trafica, your Trifecta Checker! 👋\nI look at three powers an AI agent can have: reading your private data, reading things that arrive from other people, and sending things out. When one agent has all three, a trick hidden in an incoming message can make it leak your data — that's the mix I check for you.\nStarting is easy. Just write what your agent does in the box below — for example: \"It reads my email and sends replies for me.\" You can also tap + to load a text file, or tap 🎤 and just talk to me.", "ja": "こんにちは、トラフィカだよ。三要素チェックを担当してるよ👋\nAIエージェントが持つ3つの力——大事なデータを読めること、よそから届いた文を読むこと、外に送れること——を見ていくよ。この3つが1つのエージェントにそろうと、届いた文に仕掛けられたワナで、大事なデータが漏れてしまうことがあるんだ。その危ない組み合わせになっていないか、一緒に確かめよう。\n始め方はかんたん。下の欄に、あなたのエージェントが何をしているか書いてみて。たとえば「メールを読んで、返事も送ってくれるアシスタント」みたいにね。＋ボタンでテキストファイルを読み込ませたり、🎤で話しかけたりもできるよ。", "zh": "你好，我是 Trafica，负责三要素检查👋\n我会看 AI 智能体的三种能力：读取你的重要数据、读取从外面送来的内容、把内容发送到外面。当一个智能体同时拥有这三种能力时，送来的内容里藏着的陷阱可能会让它把你的数据泄露出去。我就是来帮你检查这种危险组合的。\n开始很简单，在下面的框里写下你的智能体在做什么就行，比如：“它会读我的邮件，还会替我回复。”也可以点＋加载文本文件，或者点🎤直接跟我说。", "hi": "नमस्ते, मैं Trafica हूँ, तुम्हारी Trifecta जाँच करने वाली👋\nमैं AI एजेंट की तीन ताकतें देखती हूँ: तुम्हारा निजी डेटा पढ़ना, बाहर से आई चीज़ें पढ़ना, और बाहर कुछ भेजना। जब एक ही एजेंट के पास तीनों हों, तो बाहर से आए संदेश में छिपी चाल से तुम्हारा डेटा बाहर जा सकता है। मैं यही खतरनाक मेल जाँचती हूँ।\nशुरू करना आसान है। नीचे वाले डिब्बे में बस लिख दो कि तुम्हारा एजेंट क्या करता है — जैसे: “यह मेरी ईमेल पढ़ता है और मेरी तरफ से जवाब भी भेजता है।” + दबाकर टेक्स्ट फ़ाइल भी लगा सकते हो, या 🎤 दबाकर मुझसे बात भी कर सकते हो।", "es": "¡Hola! Soy Trafica, tu verificadora trifecta 👋\nReviso tres poderes que puede tener un agente de IA: leer tus datos privados, leer cosas que llegan de otras personas y enviar cosas fuera. Cuando un solo agente tiene los tres, un truco escondido en un mensaje entrante puede hacer que filtre tus datos. Esa es la mezcla que reviso por ti.\nEmpezar es fácil. Escribe en el cuadro de abajo qué hace tu agente, por ejemplo: «Lee mi correo y envía respuestas por mí». También puedes tocar + para cargar un archivo de texto, o tocar 🎤 y hablar conmigo."}, "placeholder": {"en": "Describe your agent here…", "ja": "エージェントの説明をここに書く…", "zh": "在这里描述您的智能体…", "hi": "अपने एजेंट का वर्णन यहाँ लिखें…", "es": "Describe tu agente aquí…"}, "check_btn": {"en": "Check", "ja": "チェック", "zh": "检查", "hi": "जाँचें", "es": "Comprobar"}, "mic_btn": {"en": "🎤", "ja": "🎤", "zh": "🎤", "hi": "🎤", "es": "🎤"}, "thinking": {"en": "Let me take a look…", "ja": "うーん、見てみるね…", "zh": "我看看啊…", "hi": "ज़रा देखने दो…", "es": "Déjame ver…"}, "yes": {"en": "Yes", "ja": "はい", "zh": "是", "hi": "हाँ", "es": "Sí"}, "no": {"en": "No", "ja": "いいえ", "zh": "不是", "hi": "नहीं", "es": "No"}, "unsure": {"en": "Not sure", "ja": "わからない", "zh": "不确定", "hi": "पता नहीं", "es": "No lo sé"}, "q_reads_private": {"en": "Let me ask one thing: can it read your important data — mail, files, calendar, that kind of thing?", "ja": "ちょっとだけ聞かせて。そのエージェント、あなたの大事なデータ（メール・ファイル・予定とか）を読める？", "zh": "我先问一句：它能读到你的重要数据吗，比如邮件、文件、日历之类的？", "hi": "एक बात पूछूँ: क्या यह तुम्हारा ज़रूरी डेटा पढ़ सकता है — मेल, फ़ाइलें, कैलेंडर वगैरह?", "es": "Te pregunto una cosa: ¿puede leer tus datos importantes, como correo, archivos o calendario?"}, "q_reads_untrusted": {"en": "And does stuff from other people reach it — incoming mail, web pages, files people upload?", "ja": "もう1つ。よその人から届いたもの（メール・Webページ・アップされたファイル）は、そのエージェントに届く？", "zh": "再问一个：别人发来的东西会到它那里吗，比如收到的邮件、网页、别人上传的文件？", "hi": "और एक बात: क्या दूसरों की भेजी चीज़ें इस तक पहुँचती हैं — आने वाले मेल, वेब पेज, लोगों की अपलोड की फ़ाइलें?", "es": "Y otra: ¿le llegan cosas de otras personas, como correos que recibe, páginas web o archivos que sube la gente?"}, "q_sends_out": {"en": "Also — can it send things out by itself? Sending mail, posting, or sending data to a server, for example.", "ja": "それと、自分から外へ送ったりできる？ たとえば、メールを送る・投稿する・どこかのサーバーに送る、みたいなこと。", "zh": "还有，它能自己往外发东西吗？比如发邮件、发帖，或者把数据发到某个服务器。", "hi": "और यह भी: क्या यह खुद बाहर कुछ भेज सकता है? जैसे मेल भेजना, पोस्ट करना, या किसी सर्वर पर डेटा भेजना।", "es": "Y también: ¿puede enviar cosas por su cuenta? Por ejemplo, mandar correos, publicar o enviar datos a un servidor."}, "q_human_approval": {"en": "One more: before it does something, do you get to say OK first?", "ja": "あと、動き出す前に、あなたが「いいよ」って確認する形になってる？", "zh": "再问一句：它行动之前，会先让你点头确认吗？", "hi": "आख़िरी बात: कुछ करने से पहले, क्या यह पहले तुम्हारी हाँ लेता है?", "es": "Una más: antes de hacer algo, ¿te pide tu OK primero?"}, "verdict_updated": {"en": "With your answers, here's how it looks now:", "ja": "答えてもらった内容で見直すと、こうだね：", "zh": "加上你的回答，现在看起来是这样：", "hi": "तुम्हारे जवाबों के साथ अब यह ऐसा दिखता है:", "es": "Con tus respuestas, así queda:"}, "split_btn": {"en": "What if I split it up?", "ja": "分けたらどうなる？", "zh": "拆开会怎样？", "hi": "बाँटने पर क्या होगा?", "es": "¿Y si lo divido?"}, "restart_btn": {"en": "Check another agent", "ja": "別のエージェントで試す", "zh": "换一个智能体试试", "hi": "दूसरा एजेंट आज़माएँ", "es": "Probar con otro agente"}, "split_intro": {"en": "If you split the powers across two agents, it looks like this:", "ja": "力を2つに分けると、こんな感じになるよ：", "zh": "把能力拆到两个智能体上，会变成这样：", "hi": "शक्तियों को दो एजेंटों में बाँटने पर ऐसा होगा:", "es": "Si divides los poderes entre dos agentes, quedaría así:"}, "var_no_out": {"en": "reader only (cannot send)", "ja": "読むだけ（送信なし）", "zh": "只读（不能发送）", "hi": "सिर्फ़ पढ़ने वाला (भेज नहीं सकता)", "es": "solo lectura (no puede enviar)"}, "var_no_untrusted": {"en": "sender only (no outside content)", "ja": "送るだけ（外の内容なし）", "zh": "只发送（不接收外部内容）", "hi": "सिर्फ़ भेजने वाला (बाहरी सामग्री नहीं)", "es": "solo envío (sin contenido externo)"}, "form_note": {"en": "(Answered the three questions)", "ja": "（3つの質問に回答）", "zh": "（已回答三个问题）", "hi": "(तीन सवालों के जवाब दिए)", "es": "(Respondió las tres preguntas)"}, "or_title": {"en": "or answer three questions instead", "ja": "代わりに3つの質問に答える", "zh": "或者回答三个问题", "hi": "या तीन सवालों के जवाब दें", "es": "o responde tres preguntas"}, "form_hint": {"en": "Tick everything your agent can do. Leave a question blank if the answer is none.", "ja": "できることに全部チェックしてください。なければ空欄でOKです。", "zh": "把您的智能体能做的都勾上；没有就留空。", "hi": "आपका एजेंट जो कर सकता है, उन सब पर निशान लगाएँ; कुछ नहीं है तो खाली छोड़ दें।", "es": "Marca todo lo que tu agente puede hacer; si no aplica, déjalo en blanco."}, "name_ph": {"en": "Agent name (optional)", "ja": "エージェント名（任意）", "zh": "智能体名称（可选）", "hi": "एजेंट का नाम (वैकल्पिक)", "es": "Nombre del agente (opcional)"}, "form_btn": {"en": "Check with these answers", "ja": "この回答でチェック", "zh": "按这些答案检查", "hi": "इन जवाबों से जाँच करें", "es": "Comprobar con estas respuestas"}, "footer": {"en": "The rating is a simple safety heuristic, not a certification. It focuses on data theft: an agent that can read private data, swallow other people's content, and send data out can be tricked into leaking what it read.", "ja": "この評価は目安であり、認証ではありません。対象は主にデータの盗み出しです：秘密のデータを読めて、他人の内容を取り込めて、外へ送れるエージェントは、だまされて読んだ内容を漏らすことがあります。", "zh": "这个评级只是一个简单的安全参考，不是认证。它主要防的是数据被盗：能读私人数据、能吞下他人内容、又能向外发送的智能体，可能被骗着把读到的内容泄露出去。", "hi": "यह रेटिंग एक सरल सुरक्षा अनुमान है, प्रमाणपत्र नहीं। इसका ध्यान डेटा चोरी पर है: जो एजेंट निजी डेटा पढ़ सके, दूसरों की सामग्री निगल सके और बाहर भेज सके, उसे बहकाकर पढ़ा हुआ डेटा लीक कराया जा सकता है।", "es": "La calificación es una heurística de seguridad sencilla, no una certificación. Se centra en el robo de datos: un agente que puede leer datos privados, tragarse el contenido de otros y enviar datos fuera puede ser engañado para filtrar lo que leyó."}, "exp_loading": {"en": "Putting it into plain words…", "ja": "分かりやすい言葉にしてみるね…", "zh": "我用大白话说一下…", "hi": "आसान शब्दों में समझाता हूँ…", "es": "Lo pongo en palabras sencillas…"}, "exp_unavailable": {"en": "(Explanation unavailable: ", "ja": "（説明を取得できませんでした：", "zh": "（无法获取说明：", "hi": "(व्याख्या उपलब्ध नहीं: ", "es": "(Explicación no disponible: "}, "error_prefix": {"en": "Could not complete the check: ", "ja": "チェックを完了できませんでした：", "zh": "无法完成检查：", "hi": "जाँच पूरी नहीं हो सकी: ", "es": "No se pudo completar la comprobación: "}, "error_tip": {"en": "Tip: add a little more detail — what it can read, what reaches it, what it can send — and try again.", "ja": "ヒント：何を読めるか・何が届くか・何を送れるかを少し足して、もう一度試してください。", "zh": "提示：补充一点细节——它能读什么、会收到什么、能发送什么——然后再试一次。", "hi": "सुझाव: थोड़ी और जानकारी जोड़ें — यह क्या पढ़ सकता है, इसे क्या मिलता है, यह क्या भेज सकता है — और फिर कोशिश क     '<span class="badge '+v.verdict+'">'+v.verdict+'</span> '+
    '<span class="muted">'+t("powers_fmt").replace("{n}", v.element_count)+
    (v.amplifiers.length ? " · "+t("plus")+" "+v.amplifiers.length : "")+'</span><div style="margin-top:6px">';
  for (const [name,on] of el)
    h += '<span class="elem '+(on?"on":"off")+'">'+(on?"✓ ":"✗ ")+name+"</span>";
  return h + "</div>";
}
async function post(url, body){
  const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  const d = await r.json();
  if (!d.ok) throw new Error(d.error || "failed");
  return d.result;
}
function chipsHTML(items){
  let h = '<div class="chips">';
  items.forEach((it, i) => { h += '<button class="chip" data-chip="'+i+'">'+esc(it.label)+"</button>"; });
  return h + "</div>";
}
function wireChips(bubbleEl, items){
  bubbleEl.querySelectorAll("[data-chip]").forEach(btn => {
    btn.onclick = () => {
      bubbleEl.querySelectorAll("[data-chip]").forEach(b => b.disabled = true);
      items[Number(btn.dataset.chip)].fn();
    };
  });
}
const EDITS = {
  reads_private: (p, ans) => { if (ans === "yes" && !p.data_access.includes("local_files")) p.data_access.push("local_files"); },
  reads_untrusted: (p, ans) => { if (ans === "yes" && !p.untrusted_inputs.includes("web_browse")) p.untrusted_inputs.push("web_browse"); },
  sends_out: (p, ans) => { if (ans === "yes" && !p.outbound.includes("http_post")) p.outbound.push("http_post"); },
  human_approval: (p, ans) => {
    if (ans === "no" && !p.amplifiers.includes("no_human_approval")) p.amplifiers.push("no_human_approval");
    if (ans === "yes") p.amplifiers = p.amplifiers.filter(a => a !== "no_human_approval");
  },
};
function levelOf(p){
  const e = (p.data_access.length?1:0)+(p.untrusted_inputs.length?1:0)+(p.outbound.length?1:0);
  if (e === 3) return 2;
  if (e === 2 || (e === 1 && p.amplifiers.length)) return 1;
  return 0;
}
function pickQuestions(result){
  // Ask at most ONE follow-up, and only when the answer could change the verdict.
  const cur = levelOf(result.profile);
  for (const key of result.unclear || []){
    const p2 = JSON.parse(JSON.stringify(result.profile));
    EDITS[key](p2, key === "human_approval" ? "no" : "yes");
    if (levelOf(p2) !== cur) return [key];
  }
  return [];
}
let runSeq = 0, qInterrupt = null, lastText = "";
async function askQuestions(keys){
  const my = runSeq;
  for (const key of keys){
    const qkey = DATA.questions[key]; if (!qkey) continue;
    const ans = await new Promise(resolve => {
      const m = addBot(esc(t(qkey)) + chipsHTML([
        {label: t("yes")}, {label: t("no")}, {label: t("unsure")}]) +
        '<div class="muted" style="margin-top:8px">'+esc(t("chips_hint"))+"</div>");
      const bubble = m.querySelector(".bubble");
      qInterrupt = () => { bubble.querySelectorAll("[data-chip]").forEach(b => b.disabled = true); resolve("typed"); };
      wireChips(bubble, [
        {label: t("yes"), fn: () => { qInterrupt = null; resolve("yes"); }},
        {label: t("no"), fn: () => { qInterrupt = null; resolve("no"); }},
        {label: t("unsure"), fn: () => { qInterrupt = null; resolve("unsure"); }},
      ]);
    });
    if (ans === "typed" || my !== runSeq) return false;
    addUser(t(ans === "yes" ? "yes" : ans === "no" ? "no" : "unsure"));
    EDITS[key](profile, ans);
  }
  const think = addThinking();
  try{
    const r = await post("/api/check-profile", {profile});
    think.querySelector(".bubble").innerHTML = verdictHTML(r.verdict, t("verdict_updated"));
    verdict = r.verdict;
  }catch(e){ think.querySelector(".bubble").textContent = t("error_prefix") + e.message; }
  return true;
}
async function explainFlow(){
  const m = addBot('<span class="muted">'+esc(t("exp_loading"))+"</span>");
  try{
    const exp = await post("/api/explain", {verdict, profile, lang});
    m.querySelector(".bubble").innerHTML = "<pre></pre>";
    m.querySelector("pre").textContent = exp.explanation;
  }catch(e){
    m.querySelector(".bubble").textContent = t("exp_unavailable") + e.message + ")";
  }
}
async function showSplit(){
  const think = addThinking();
  try{
    const a = JSON.parse(JSON.stringify(profile)); a.outbound = [];
    const b = JSON.parse(JSON.stringify(profile)); b.untrusted_inputs = [];
    const ra = await post("/api/check-profile", {profile: a});
    const rb = await post("/api/check-profile", {profile: b});
    think.querySelector(".bubble").innerHTML = esc(t("split_intro")) +
      '<div style="margin-top:8px">'+esc(t("var_no_out"))+' → <span class="badge '+ra.verdict.verdict+'">'+ra.verdict.verdict+"</span></div>"+
      '<div style="margin-top:6px">'+esc(t("var_no_untrusted"))+' → <span class="badge '+rb.verdict.verdict+'">'+rb.verdict.verdict+"</span></div>";
  }catch(e){ think.querySelector(".bubble").textContent = t("error_prefix") + e.message; }
}
async function runCheck(url, body, isText){
  const my = ++runSeq;
  const think = addThinking();
  try{
    const result = await post(url, body);
    if (my !== runSeq) return;
    profile = result.profile; verdict = result.verdict;
    think.querySelector(".bubble").innerHTML = verdictHTML(verdict, "");
    if (isText){
      const qs = pickQuestions(result);
      if (qs.length){
        const ok = await askQuestions(qs);
        if (!ok || my !== runSeq) return;
      }
    }
    await explainFlow();
  }catch(e){
    if (my !== runSeq) return;
    think.querySelector(".bubble").innerHTML = esc(t("error_prefix") + String(e.message)) +
      '<br><span class="muted">'+esc(t("error_tip"))+"</span>";
  }finally{ scrollDown(); }
}
async function runFollowup(text){
  const my = ++runSeq;
  const think = addThinking();
  try{
    const r = await post("/api/followup", {message: text, profile, verdict, lang});
    if (my !== runSeq) return;
    if (r.action === "new"){
      think.remove(); lastText = text;
      runCheck("/api/check", {text}, true);
      return;
    }
    if (r.reply){
      think.querySelector(".bubble").innerHTML = "<pre></pre>";
      think.querySelector("pre").textContent = r.reply;
    } else think.remove();
    if (r.action === "split") await showSplit();
  }catch(e){
    think.remove(); lastText = text;
    runCheck("/api/check", {text}, true);
  }
}
function stopVoice(){ if (listening) stopVoiceKeep(); }
function sendText(){
  const box = document.getElementById("desc");
  const text = box.value.trim(); if (!text) return;
  box.value = ""; autogrow();
  stopVoice();
  started = true;
  addUser(text);
  if (qInterrupt){
    const f = qInterrupt; qInterrupt = null; runSeq++; f();
    lastText = (lastText + " " + text).trim();
    runCheck("/api/check", {text: lastText}, true);
  } else if (verdict){
    runFollowup(text);
  } else {
    lastText = text;
    runCheck("/api/check", {text}, true);
  }
}
let started = false;
function setLang(l){
  lang = l;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.getElementById("desc").placeholder = t("placeholder");
  const g = document.getElementById("greeting");
  if (g && !started) g.innerHTML = esc(t("greeting")).replaceAll("
", "<br>");
}
const SPEECH_LANG = {en: "en-US", ja: "ja-JP", zh: "zh-CN", hi: "hi-IN", es: "es-ES"};
let recog = null, listening = false, voiceBase = "", recStart = 0, recTimer = null;
let micStream = null, audioCtx = null, analyser = null;
function waveEl(){ return document.getElementById("wave"); }
function buildWave(){
  const w = waveEl();
  if (!w.children.length) for (let i = 0; i < 36; i++) w.appendChild(document.createElement("span"));
}
function fmtTime(ms){ const s = Math.floor(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
async function startWave(){
  buildWave();
  try{
    micStream = await navigator.mediaDevices.getUserMedia({audio: true});
    if (!listening){ micStream.getTracks().forEach(tr => tr.stop()); micStream = null; return; }
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 128;
    src.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    const bars = waveEl().children;
    const loop = () => {
      if (!listening || !analyser) return;
      analyser.getByteFrequencyData(data);
      for (let i = 0; i < bars.length; i++){
        const v = data[Math.floor(i*data.length/bars.length)]/255;
        bars[i].style.height = (3 + v*22) + "px";
      }
      requestAnimationFrame(loop);
    };
    loop();
  }catch(_){ waveEl().classList.add("cssanim"); }
}
function stopWave(){
  if (micStream){ micStream.getTracks().forEach(tr => tr.stop()); micStream = null; }
  if (audioCtx){ audioCtx.close().catch(() => {}); audioCtx = null; }
  analyser = null;
  waveEl().classList.remove("cssanim");
}
function endVoiceUI(){
  listening = false;
  if (recTimer){ clearInterval(recTimer); recTimer = null; }
  stopWave();
  document.getElementById("recbar").classList.remove("on");
  document.getElementById("composer").style.display = "flex";
}
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  if (listening){ stopVoiceKeep(); return; }
  recog = new SR();
  recog.lang = SPEECH_LANG[lang] || "en-US";
  recog.interimResults = true;
  recog.continuous = true;
  const box = document.getElementById("desc");
  voiceBase = box.value;
  recog.onresult = (e) => {
    let s = "";
    for (const r of e.results) s += r[0].transcript;
    box.value = voiceBase + (voiceBase && s ? " " : "") + s;
    autogrow();
  };
  recog.onend = () => { if (listening) endVoiceUI(); };
  recog.onerror = () => { if (listening) endVoiceUI(); };
  recog.start();
  listening = true;
  document.getElementById("composer").style.display = "none";
  document.getElementById("recbar").classList.add("on");
  recStart = Date.now();
  document.getElementById("rectime").textContent = "0:00";
  recTimer = setInterval(() => { document.getElementById("rectime").textContent = fmtTime(Date.now() - recStart); }, 500);
  startWave();
}
function stopVoiceKeep(){
  if (recog){ recog.onresult = null; recog.onend = null; recog.onerror = null; try{ recog.stop(); }catch(_){} }
  endVoiceUI();
}
function discardVoice(){
  document.getElementById("desc").value = voiceBase; autogrow();
  stopVoiceKeep();
}
function sendVoice(){ stopVoiceKeep(); sendText(); }
function autogrow(){
  const box = document.getElementById("desc");
  box.style.height = "auto";
  box.style.height = Math.min(box.scrollHeight, 180) + "px";
}
const INIT_LANG = (navigator.language || "en").slice(0, 2);
document.getElementById("lang").value = ["en","ja","zh","hi","es"].includes(INIT_LANG) ? INIT_LANG : "en";
setLang(document.getElementById("lang").value);
addBot('<span id="greeting"></span>');
document.getElementById("greeting").innerHTML = esc(t("greeting")).replaceAll("
", "<br>");
if (!(window.SpeechRecognition || window.webkitSpeechRecognition))
  document.getElementById("micbtn").style.display = "none";
document.getElementById("desc").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendText(); }
});
document.getElementById("desc").addEventListener("input", autogrow);
document.getElementById("filein").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try{
    if (f.size > 200000) throw new Error("too big");
    const text = await f.text();
    const box = document.getElementById("desc");
    box.value = (box.value ? box.value + "
" : "") + text.trim();
    autogrow(); box.focus();
  }catch(_){ addBot(esc(t("attach_error"))); }
});
